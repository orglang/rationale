name: Agent workflow evaluations

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model ID used for the agent under test
        required: true
        type: string
      grader_model:
        description: Different model ID for DeepEval G-Eval grading
        required: true
        type: string
      ref:
        description: Branch, tag, or commit SHA to evaluate
        required: true
        default: refactor/agent-instruction-ownership
        type: string

permissions:
  contents: read

concurrency:
  group: agent-workflow-evals-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    environment: behavioral-evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out requested snapshot
        uses: actions/checkout@v4
        with:
          ref: \${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evaluation dependencies
        run: python -m pip install -r tests/agent-workflows/requirements-eval.txt

      - name: Validate runner syntax
        run: python -m py_compile tests/agent-workflows/run_eval.py

      - name: Run behavioral evaluations
        env:
          OPENAI_API_KEY: \${{ secrets.OPENAI_API_KEY }}
          OPENAI_EVAL_MODEL: \${{ inputs.model }}
          OPENAI_EVAL_GRADER_MODEL: \${{ inputs.grader_model }}
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
        run: |
          python tests/agent-workflows/run_eval.py \
            --repo-root . \
            --output-dir eval-results

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-workflow-evaluation-\${{ github.run_id }}
          path: eval-results/
          if-no-files-found: warn
          retention-days: 30
